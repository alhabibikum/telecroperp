[package]
name = "firoza_erp"
version = "1.0.10"
description = "FIROZA ERP Desktop Application"
authors = ["FIROZA ENTERPRISE"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
tauri-plugin-updater = "=2.7.1"
tauri-plugin-process = "2"

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v2.6.1" }
