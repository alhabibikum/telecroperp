<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14b8a6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#334155" stroke-width="4" opacity="0.4" />

  <!-- Mobile phone frame -->
  <g filter="url(#glow)">
    <rect x="156" y="86" width="200" height="340" rx="36" fill="#0f172a" stroke="url(#phoneGrad)" stroke-width="12" />
    
    <!-- Phone Screen Inner -->
    <rect x="174" y="126" width="164" height="256" rx="16" fill="#1e293b" />

    <!-- Speaker Bar / Notch -->
    <rect x="226" y="104" width="60" height="6" rx="3" fill="#64748b" />
    <circle cx="304" cy="107" r="3" fill="#0ea5e9" />

    <!-- Screen Content: Modern ERP Analytics / Bar Chart -->
    <rect x="194" y="270" width="22" height="92" rx="6" fill="#14b8a6" />
    <rect x="228" y="220" width="22" height="142" rx="6" fill="#3b82f6" />
    <rect x="262" y="170" width="22" height="192" rx="6" fill="#06b6d4" />
    <rect x="296" y="140" width="22" height="222" rx="6" fill="#22c55e" />

    <!-- Growth Trendline Arrow -->
    <path d="M190 280 L234 230 L270 180 L315 140" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="318,132 322,148 308,145" fill="#f8fafc" />

    <!-- Home indicator bar -->
    <rect x="226" y="404" width="60" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- Signal / Network / Offline-Ready Badge Wave -->
  <g transform="translate(356, 96)">
    <circle cx="24" cy="24" r="34" fill="#0f172a" stroke="#22c55e" stroke-width="6" />
    <path d="M15 24 L21 30 L33 18" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
